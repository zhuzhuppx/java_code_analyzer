<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProjectAssistant</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f5;color:#1e293b;font-size:14px}
.h{display:none!important}
.hdr{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr h1{font-size:16px}.hdr h1 em{font-style:normal;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#akey{cursor:pointer}.mn{display:flex;padding:20px 24px;gap:20px;max-width:1500px;margin:0 auto}
.sb{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}.ct{flex:1;display:flex;flex-direction:column;gap:16px}
.cd{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ig{display:flex;gap:8px}.ig input{flex:1;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-p{background:#6366f1;color:#fff}.btn-p:disabled{opacity:.5;cursor:not-allowed}
.st{display:flex;gap:10px;padding:10px 16px;border-radius:8px;font-size:13px}
.st-i{background:#f1f5f9;color:#64748b}.st-r{background:#fef9c3;color:#854d0e}
.st-d{background:#dcfce7;color:#166534}.st-e{background:#fee2e2;color:#991b1b}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.si{background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;border-radius:10px;padding:12px;text-align:center}
.si .n{font-size:20px;font-weight:700}.si .l{font-size:11px;opacity:.8;margin-top:2px}
.si.w{background:linear-gradient(135deg,#f59e0b,#d97706)}
.si.d{background:linear-gradient(135deg,#ef4444,#dc2626)}
.si.s{background:linear-gradient(135deg,#10b981,#059669)}
.ri{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.ri .nm{font-size:13px;color:#6366f1;cursor:pointer;font-weight:500}
.rb{font-size:13px}.rb h2{font-size:15px;color:#6366f1;margin:14px 0 6px}
.rb table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12px}
.rb th,td{border:1px solid #e2e8f0;padding:4px 6px}.rb th{background:#f8fafc;font-weight:600}
.rb code{background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:12px}
.rb pre{background:#1e293b;color:#e2e8f0;padding:10px 14px;border-radius:6px;overflow-x:auto;font-size:12px}
.chb{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:10px;max-height:400px}
.cm{display:flex;gap:8px}.cm .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.cm.u{flex-direction:row-reverse}.cm.u .av{background:#e0e7ff;color:#6366f1}.cm.a .av{background:#fae8ff;color:#a21caf}
.cm .tx{padding:8px 12px;border-radius:10px;font-size:13px;max-width:80%}
.cm.u .tx{background:#6366f1;color:#fff}.cm.a .tx{background:#f1f5f9;color:#1e293b}
.chi{display:flex;gap:8px;margin-top:8px}.chi input{flex:1;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none}
.wl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;text-align:center}
.wl .ico{font-size:40px;margin-bottom:12px}.wl h2{font-size:18px;margin-bottom:6px}
.wl p{color:#64748b;max-width:360px;font-size:13px}
.wl .tags{display:flex;gap:10px;font-size:11px;color:#64748b;margin-top:16px;flex-wrap:wrap;justify-content:center}
</style></head>
<body style="display:flex;flex-direction:column;min-height:100vh">
<div class="hdr"><h1>🔍 <em>ProjectAssistant</em></h1><div class="m"><span id="akey" onclick="sk()">🔑 Key</span><span id="sc">0</span></div></div>
<div class="mn"><div class="sb">
<div class="cd"><div class="ig"><input id="pi" placeholder="/path/to/project" value="{{DEFAULT_PATH}}" onkeydown="if(event.key==='Enter')scan()">
<button class="btn btn-p" id="sb" onclick="scan()">🚀</button></div></div>
<div class="st st-i" id="sta">⏳ 输入路径</div>
<div class="cd h" id="scd"><div class="sg" id="sg"></div><div class="pb"><div class="fl" id="pf"></div></div></div>
<div class="cd" style="flex:1"><div style="display:flex;justify-content:space-between"><span>📄 报告</span><button onclick="lr()">🔄</button></div><div id="rc"><div class="es">暂无</div></div></div>
</div><div class="ct">
<div class="cd h" id="pc"><div style="display:flex;justify-content:space-between"><span>📖 报告</span><div><button onclick="rp()">🔄</button><button onclick="cp()">✕</button></div></div>
<div class="rb" id="pct"><p style="color:#64748b">选择报告</p></div></div>
<div class="cd h" id="cc"><div style="display:flex;justify-content:space-between"><span>💬 对话</span><button onclick="hcp()">✕</button></div>
<div class="cht"><div class="chb" id="chb"><div style="text-align:center;color:#64748b;font-size:12px;padding:20px 0">扫描完成后可以对话</div></div>
<div class="chi"><input id="chq" placeholder="询问项目..." onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Ask</button></div></div></div>
<div class="cd wl" id="wc"><div class="ico">🔍</div><h2>Java ProjectAssistant</h2>
<p>输入路径扫描，完成后可以问 AI</p>
</div></div></div></div>
<script>
var pt_,cr;
function md(t){try{return marked.parse(t)}catch(e){return '<pre>'+t.replace(/</g,'&lt;')+'</pre>'}}
function scan(){var p=document.getElementById('pi').value.trim();if(!p)return;document.getElementById('sb').disabled=true;
fetch('/scan',{method:'POST',body:'path='+encodeURIComponent(p),headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(r=>r.json()).then(d=>{if(d.status==='started')pp()})}
function pp(){fetch('/status').then(r=>r.json()).then(d=>{if(d.status==='running'){document.getElementById('sta').className='st st-r';document.getElementById('sta').innerHTML=(d.phase||'')+'('+d.elapsed+'s)';pt_=setTimeout(pp,1500)}else if(d.status==='done'){document.getElementById('sb').disabled=false;document.getElementById('scd').classList.remove('h');document.getElementById('wc').classList.add('h');document.getElementById('cc').classList.remove('h');lr();fs(d)}else if(d.status==='error'){document.getElementById('sb').disabled=false}})}
function fs(d){var g=document.getElementById('sg');g.innerHTML='';['classes','methods','lines','apis'].forEach(k=>{var x=document.createElement('div');x.className='si';x.innerHTML='<div class="n">'+(d[k]||0)+'</div><div class="l">'+k+'</div>';g.appendChild(x)});['vulns','health'].forEach(k=>{var x=document.createElement('div');x.className='si'+(k==='vulns'&&(+d[k]||0)>0?' d':k==='health'?(+d[k]||0)<60?' d':(+d[k]||0)<80?' w':' s':'');x.innerHTML='<div class="n">'+(d[k]||'-')+'</div><div class="l">'+k+'</div>';g.appendChild(x)})}
function lr(){fetch('/reports').then(r=>r.json()).then(l=>{document.getElementById('sc').textContent=l.length;document.getElementById('rc').innerHTML=l.length?l.map(f=>'<div class="ri"><span class="nm" onclick="sr(\''+f+'\')">'+f+'</span></div>'):'<div class="es">暂无</div>'})}
var crf={};function sr(f){document.getElementById('wc').classList.add('h');document.getElementById('pc').classList.remove('h');cr=f;document.getElementById('pct').innerHTML='加载中...';fetch('/reports?file='+encodeURIComponent(f)).then(r=>r.text()).then(c=>{crf[f]=c;document.getElementById('pct').innerHTML=md(c)})}
function rp(){if(cr)document.getElementById('pct').innerHTML=md(crf[cr])}
function cp(){document.getElementById('pc').classList.add('h');document.getElementById('wc').classList.remove('h');cr=0}
function hcp(){document.getElementById('cc').classList.add('h')}
function sk(){var k=prompt('DeepSeek API Key:');if(k)fetch('/apikey',{method:'POST',body:'key='+encodeURIComponent(k),headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(r=>r.json()).then(d=>{if(d.status==='ok'){document.getElementById('akey').textContent='🔑 ✅'}})}
function ask(){var q=document.getElementById('chq').value.trim();if(!q)return;document.getElementById('chq').value='';var b=document.getElementById('chb');b.innerHTML+='<div class="cm u"><div class="av">👤</div><div class="tx">'+q+'</div></div>';
fetch('/chat',{method:'POST',body:'question='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(r=>r.json()).then(d=>{b.innerHTML+='<div class="cm a"><div class="av">🐋</div><div class="tx">'+md(d.reply||d.error||'失败')+'</div></div>'})}
lr();
</script>
</body>
</html>
