<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Java老狗</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1e293b;font-size:14px}
.h{display:none!important}

/* Header */
.hdr{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
.hdr h1{font-size:15px;display:flex;align-items:center;gap:6px}
.hdr h1 em{font-style:normal;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .m{font-size:12px;color:#64748b;display:flex;gap:12px;align-items:center}
#akey{cursor:pointer;padding:4px 8px;border-radius:4px}
#akey:hover{background:#f1f5f9}

/* Two-column layout */
.mn{display:flex;height:calc(100vh - 48px);overflow:hidden;position:relative}

/* Left panel */
.lp{width:309px;min-width:309px;max-width:600px;display:flex;flex-direction:column;background:#fff;border-right:1px solid #e2e8f0;flex-shrink:0;position:relative}
.lp.c{width:0!important;overflow:hidden;min-width:0;border-right:none}
.lp .rg{position:absolute;right:-8px;top:0;bottom:0;width:16px;cursor:col-resize;z-index:10;background:transparent;border:none;display:flex;align-items:center;justify-content:center}
.lp .rg::after{content:'';display:block;width:4px;height:32px;background:#cbd5e1;border-radius:2px;transition:background .15s}
.lp .rg:hover::after,.lp .rg:active::after{background:#6366f1;height:48px}
.tb{position:absolute;left:309px;top:50%;transform:translateY(-50%);width:16px;height:40px;background:#e2e8f0;border:none;border-radius:0 4px 4px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#64748b;z-index:20;transition:left .2s}
.tb:hover{background:#cbd5e1}
.lp.c ~ .tb{left:0}
.lc{display:flex;flex-direction:column;gap:10px;padding:12px;overflow-y:auto;flex:1}
.ig{display:flex;gap:6px}.ig input{flex:1;padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:13px;outline:none}
.ig input:focus{border-color:#6366f1}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.btn-p{background:#6366f1;color:#fff}.btn-p:hover{box-shadow:0 3px 8px rgba(99,102,241,.25)}.btn-p:disabled{opacity:.5;cursor:not-allowed}
.st{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:12px}
.st-i{background:#f1f5f9;color:#64748b}.st-r{background:#fef9c3;color:#854d0e}.st-d{background:#dcfce7;color:#166534}.st-e{background:#fee2e2;color:#991b1b}
.sp{width:12px;height:12px;border:2px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.si{background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;border-radius:8px;padding:8px;text-align:center}
.si .n{font-size:16px;font-weight:700}.si .l{font-size:10px;opacity:.8;margin-top:1px}
.si.w{background:linear-gradient(135deg,#f59e0b,#d97706)}.si.d{background:linear-gradient(135deg,#ef4444,#dc2626)}.si.s{background:linear-gradient(135deg,#10b981,#059669)}

/* Project history list */
.hi{padding:8px;border-radius:8px;cursor:pointer;transition:background .15s;border:1.5px solid transparent}
.hi:hover{background:#f1f5f9}
.hi.ac{border-color:#6366f1;background:#eef2ff}
.hi .nm{font-size:13px;font-weight:600;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi .tm{font-size:11px;color:#94a3b8;margin-top:2px}
.hi .st2{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.hi .st2 span{font-size:10px;padding:2px 5px;border-radius:4px;background:#f1f5f9;color:#64748b}
.es{text-align:center;padding:20px 0;color:#94a3b8;font-size:12px}

/* Right panel - Chat full height */
.rp{flex:1;display:flex;flex-direction:column;background:#fff}
.ch{display:flex;flex-direction:column;flex:1;min-height:0}
.chh{padding:12px 16px;font-size:13px;font-weight:600;color:#475569;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff}
.chh button{background:none;border:none;cursor:pointer;color:#94a3b8;padding:4px 6px;border-radius:4px;font-size:12px}
.chh button:hover{background:#f1f5f9;color:#475569}
.chb{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#f8fafc;scroll-behavior:smooth}
.cm{display:flex;gap:8px;max-width:82%;animation:fi .15s}
@keyframes fi{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.cm.r{margin-left:auto;flex-direction:row-reverse}
.cm .av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:4px}
.cm.r .av{background:#6366f1;color:#fff;order:1}
.cm.l .av{background:#e2e8f0;color:#475569}
.cm .tx{padding:10px 16px;border-radius:14px;font-size:14px;line-height:1.6;overflow-wrap:break-word;white-space:pre-wrap;word-break:break-word}
.cm.r .tx{background:#6366f1;color:#fff;border-bottom-right-radius:4px;line-height:1.5}
.cm.l .tx{background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cm.l .tx code{background:#f1f5f9;padding:2px 5px;border-radius:4px;font-size:13px;color:#1e293b;font-family:'SF Mono','Fira Code','Consolas',monospace}
.cm.l .tx pre{background:#1e293b;color:#e2e8f0;padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:13px;margin:8px 0;line-height:1.5;font-family:'SF Mono','Fira Code','Consolas',monospace;position:relative}
.cm.l .tx pre code{background:none;padding:0;font-size:inherit;color:inherit}
.cm.l .tx p{margin:4px 0}
.cm.l .tx ul,.cm.l .tx ol{padding-left:20px;margin:4px 0}
.cm.l .tx li{margin:2px 0}
.cm.l .tx h1,.cm.l .tx h2,.cm.l .tx h3,.cm.l .tx h4{margin:8px 0 4px;font-weight:600}
.cm.l .tx a{color:#6366f1;text-decoration:none}
.cm.l .tx a:hover{text-decoration:underline}
.cm.l .tx blockquote{border-left:3px solid #6366f1;padding:4px 12px;margin:6px 0;background:#f8fafc;border-radius:0 6px 6px 0;color:#475569}
.cm.l .tx table{border-collapse:collapse;margin:6px 0;font-size:13px;width:100%}
.cm.l .tx td,.cm.l .tx th{border:1px solid #e2e8f0;padding:6px 10px;text-align:left}
.cm.l .tx th{background:#f1f5f9;font-weight:600}
.cpb,.wpb{margin:0;background:#f1f5f9;border:0;cursor:pointer;font-size:20px;color:#64748b;padding:0;position:absolute;bottom:-20px;line-height:1.6;z-index:5;opacity:.4;transition:opacity .2s,background .2s}
.cpb{left:32px}.wpb{left:58px}
.cm:hover .cpb,.cm:hover .wpb{opacity:1}.cpb:hover,.wpb:hover{background:#e2e8f0;color:#475569}
.cm{position:relative;padding-bottom:14px}
.dr{height:10px;cursor:row-resize;flex-shrink:0;position:relative;z-index:5;user-select:none;-webkit-user-select:none}
.dr::after{content:'';display:block;height:3px;width:40px;background:#cbd5e1;border-radius:2px;position:absolute;top:3.5px;left:50%;transform:translateX(-50%);transition:background .15s,width .15s,height .15s}
.dr:hover::after,.dr:active::after{background:#6366f1;width:50px;height:4px}
.chf{display:flex;gap:10px;padding:14px 20px;border-top:none;flex-shrink:0;background:#fff;min-height:60px}
.chf textarea{flex:1;padding:12px 20px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none;background:#f8fafc;font-family:inherit;line-height:1.4;min-height:40px}
.chf textarea:focus{border-color:#6366f1;background:#fff}
.chf button{width:44px;height:44px;border:none;border-radius:50%;background:#6366f1;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;align-self:flex-end}
.chf button:hover{box-shadow:0 2px 8px rgba(99,102,241,.3)}
.chf button:disabled{opacity:.4;cursor:not-allowed}
.chp{text-align:center;padding:30px 0;color:#94a3b8;font-size:13px}
</style></head>
<body style="display:flex;flex-direction:column;height:100vh">
<div class="hdr"><h1>&#x1F50D; <em>Java老狗</em></h1><div class="m"><span id="akey" onclick="sk()">&#x1F511; Key</span></div></div>
<div class="mn">
<!-- Left Panel -->
<div class="lp" id="lp"><button class="rg" id="rh"></button><div class="lc">
<div class="ig"><input id="pi" placeholder="/path/to/project" value="{{DEFAULT_PATH}}" onkeydown="if(event.key==='Enter')scan()">
<button class="btn btn-p" id="sb" onclick="scan()">&#x1F680;</button></div>
<div class="st st-i" id="sta">&#x23F3; 输入路径</div>
<div class="h" id="scd"><div class="sg" id="sg"></div><div style="margin-top:6px;display:flex;gap:4px"><button class="btn btn-g bs" id="skb" onclick="skl()" disabled style="opacity:.4;flex:1;padding:5px 8px">&#x1F4E6; 导出 Skill</button></div><div id="skt" style="font-size:11px;color:#94a3b8;margin-top:2px;text-align:center;display:none">解压后运行: copaw skill install ./SKILL.md所在目录</div></div>
<div style="border-top:1px solid #e2e8f0;padding-top:8px;margin:8px 0">
<div style="font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px">&#x1F5C4;&#xFE0F; 数据库连接 <span style="font-weight:400;color:#94a3b8;font-size:11px">&#x1F512; 只读</span></div>
<div style="display:flex;flex-direction:column;gap:4px">
<input id="dbu" placeholder="jdbc:mysql://localhost:3306/dbname" style="padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;outline:none;font-family:inherit">
<div style="display:flex;gap:4px">
<input id="dbn" placeholder="用户" style="flex:1;padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;outline:none;font-family:inherit">
<input id="dbp" placeholder="密码" type="password" style="flex:1;padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;outline:none;font-family:inherit">
<button class="btn btn-p" id="dbb" onclick="dbConnect()" style="padding:5px 10px;font-size:12px">&#x1F517;</button></div>
<div id="dbr" style="font-size:12px;color:#64748b;margin-top:2px;line-height:1.5"></div>
<div id="dbt" style="max-height:200px;overflow-y:auto;display:none;margin-top:4px"></div>
</div></div>
<div><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px"><span>&#x1F4C5; 项目历史</span><button class="btn btn-g bs" onclick="lh()">&#x1F504;</button></div>
<div id="hc" style="max-height:400px;overflow-y:auto"></div></div>
</div></div>
<button class="tb" id="ltg" onclick="tp()">&#x25C0;</button>
<!-- Right Panel - Chat Full Height -->
<div class="rp" id="rp">
<div class="ch"><div class="chh"><span>&#x1F4AC; 对话</span><div><button onclick="ew()" title="导出为 Word 文档">&#x1F4C4; Word</button><button onclick="cc()" title="清除对话">&#x1F5D1; 清除</button></div></div>
<div class="chb" id="chb"><div class="chp">&#x1F50D; 扫描项目后开始对话</div></div>
<div class="dr" id="cdr"></div>
<div class="chf"><textarea id="chq" placeholder="询问项目... (Enter发送, Shift+Enter换行)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ask()}" disabled></textarea>
<button onclick="ask()" id="sbb" disabled>&#x27A1;</button></div></div></div>
</div>
<script>
var cr,ph='',dd=false,cid=-1;
function md(t){try{return marked.parse(t)}catch(e){return '<pre>'+t.replace(/</g,'&lt;')+'</pre>'}}
function sc(){var e=document.getElementById('chb');e.scrollTop=e.scrollHeight}
function ac(m){var b=document.getElementById('chb');b.innerHTML+='<div class="cm l"><div class="av">&#x1F40B;</div><div class="tx">'+m+'</div></div>';sc()}
function scan(){var p=document.getElementById('pi').value.trim();if(!p)return;document.getElementById('sb').disabled=true;ph='';dd=false;cid=-1;
document.getElementById('chq').disabled=true;document.getElementById('sbb').disabled=true;
document.getElementById('chb').innerHTML='<div class="cm l"><div class="av">&#x1F40B;</div><div class="tx">&#x1F680; 开始扫描...</div></div>';sc();
fetch('/scan',{method:'POST',body:'path='+encodeURIComponent(p),headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(r=>r.json()).then(d=>{if(d.status==='started')pp()})}
function pp(){if(dd)return;fetch('/status').then(r=>r.json()).then(d=>{
var el=document.getElementById('sta');
if(d.status==='running'){el.className='st st-r';el.innerHTML='<span class="sp"></span>'+(d.phase||'')+'('+d.elapsed+'s)';
if(d.phase&&d.phase!==ph){ph=d.phase;ac(d.phase+' ('+d.elapsed+'s)')}
setTimeout(pp,1500)}
else if(d.status==='done'){dd=true;el.className='st st-d';el.innerHTML='&#x2705; 完成('+d.elapsed+'s)';document.getElementById('sb').disabled=false;document.getElementById('scd').classList.remove('h');document.getElementById('chq').disabled=false;document.getElementById('sbb').disabled=false;
if(d.projectId){cid=d.projectId;var skb=document.getElementById('skb');skb.disabled=false;skb.style.opacity='1';document.getElementById('skt').style.display='block'}
ac('&#x2705; 扫描完成 ('+d.elapsed+'s)，输入问题开始对话');fs(d);lh()}
else if(d.status==='error'){dd=true;el.className='st st-e';el.innerHTML='&#x274C; '+d.message;document.getElementById('sb').disabled=false;ac('&#x274C; 扫描失败: '+d.message)}
}).catch(function(){if(!dd)setTimeout(pp,1500)})}
function fs(d){var g=document.getElementById('sg');g.innerHTML='';
['classes','methods','lines','apis'].forEach(function(k){var x=document.createElement('div');x.className='si';x.innerHTML='<div class="n">'+(d[k]||0)+'</div><div class="l">'+k+'</div>';g.appendChild(x)});var sk=['vulns','health'];sk.forEach(function(k){var x=document.createElement('div');x.className='si'+(k==='vulns'&&(+d[k]||0)>0?' d':k==='health'?(+d[k]||0)<60?' d':(+d[k]||0)<80?' w':' s':'');x.innerHTML='<div class="n">'+(d[k]||'-')+'</div><div class="l">'+k+'</div>';g.appendChild(x)});}
function lh(){var u='/history?_='+Date.now();fetch(u).then(r=>r.json()).then(function(l){var c=document.getElementById('hc');if(!l.length){c.innerHTML='<div class="es">暂无项目</div>';return}
c.innerHTML=l.map(function(p){var h='<div class="hi'+(cid==p.id?' ac':'')+'" onclick="lp('+p.id+')">'+'<div class="nm">&#x1F4C1; '+p.name+'</div>'+'<div class="tm">'+p.path+' &middot; '+(p.scannedAt||'').substring(0,19)+'</div>'+'<div class="st2">'+'<span>classes:'+p.classes+'</span><span>apis:'+p.apis+'</span><span>health:'+p.health+'</span>'+(p.chatCount?'<span>&#x1F4AC;'+p.chatCount+'</span>':'')+'</div></div>';return h}).join('')})}
function lp(id){cid=id;fetch('/project?id='+id).then(r=>r.json()).then(function(d){document.getElementById('pi').value=d.path;document.getElementById('chq').disabled=false;document.getElementById('sbb').disabled=false;
// Update stats
var g=document.getElementById('sg');g.innerHTML='';
['classes','methods','lines','apis'].forEach(function(k){var x=document.createElement('div');x.className='si';x.innerHTML='<div class="n">'+(d[k]||0)+'</div><div class="l">'+k+'</div>';g.appendChild(x)});var sk=['vulns','health'];sk.forEach(function(k){var x=document.createElement('div');x.className='si'+(k==='vulns'&&(+d[k]||0)>0?' d':k==='health'?(+d[k]||0)<60?' d':(+d[k]||0)<80?' w':' s':'');x.innerHTML='<div class="n">'+(d[k]||'-')+'</div><div class="l">'+k+'</div>';g.appendChild(x)});
document.getElementById('scd').classList.remove('h');
document.getElementById('sta').className='st st-d';document.getElementById('sta').innerHTML='&#x1F4C2; '+d.name;
var skb=document.getElementById('skb');skb.disabled=false;skb.style.opacity='1';document.getElementById('skt').style.display='block';
// Load chat history
var b=document.getElementById('chb');b.innerHTML='';
if(d.chats&&d.chats.length){d.chats.forEach(function(c){var side=c.role==='user'?'r':'l';var av=c.role==='user'?'&#x1F464;':'&#x1F40B;';b.innerHTML+='<div class="cm '+side+'"><div class="av">'+av+'</div><div class="tx">'+(c.role==='assistant'?md(c.content):c.content)+'</div><button class="cpb" onclick="copyMsg(this)" title="复制这条消息">&#x1F4CB;</button><button class="wpb" onclick="exportMsg(this)" title="导出到 Word">&#x1F4C4;</button></div>'})}else{b.innerHTML='<div class="chp">没有聊天记录，开始提问</div>'}
sc();lh()})}
function sk(){var k=prompt('DeepSeek API Key:');if(k){localStorage.setItem('dsKey',k);ck()}}
function ck(){var k=localStorage.getItem('dsKey');document.getElementById('akey').innerHTML=k?'&#x1F511; &#x2705;':'&#x1F511; Key';document.getElementById('akey').title=k?'已保存在浏览器':'未配置'}
function ask(){var q=document.getElementById('chq').value.trim();if(!q)return;document.getElementById('chq').value='';var b=document.getElementById('chb');
b.innerHTML+='<div class="cm r"><div class="av">&#x1F464;</div><div class="tx">'+q+'</div><button class="cpb" onclick="copyMsg(this)" title="复制这条消息">&#x1F4CB;</button><button class="wpb" onclick="exportMsg(this)" title="导出到 Word">&#x1F4C4;</button></div>';sc();
var di=document.createElement('div');di.className='cm l';di.innerHTML='<div class="av">&#x1F40B;</div><div class="tx"><span class="sp"></span></div>';b.appendChild(di);sc();
var tx=di.querySelector('.tx');
var k=localStorage.getItem('dsKey')||'';
var acc='';
fetch('/chat',{method:'POST',body:'question='+encodeURIComponent(q)+'&apiKey='+encodeURIComponent(k)+'&projectId='+cid,headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(function(r){
var reader=r.body.getReader(),dec=new TextDecoder(),buf='';
function rd(){reader.read().then(function(rt){if(rt.done){tx.innerHTML=md(acc);sc();var cb=document.createElement('button');cb.className='cpb';cb.onclick=function(){copyMsg(this)};cb.title='复制这条消息';cb.textContent='📋';di.appendChild(cb);var wb=document.createElement('button');wb.className='wpb';wb.onclick=function(){exportMsg(this)};wb.title='导出到 Word';wb.textContent='📄';di.appendChild(wb);return}
buf+=dec.decode(rt.value,{stream:true});var ls=buf.split('\n');buf=ls.pop();
ls.forEach(function(l){if(!l.startsWith('data: '))return;
try{var o=JSON.parse(l.substring(6));if(o.type==='content'){acc+=o.data;tx.innerHTML=md(acc);sc()}
else if(o.type==='error'){tx.innerHTML='<span style="color:#dc2626">'+o.data+'</span>';sc()}
else if(o.type==='done'){tx.innerHTML=md(acc);sc()}}catch(e){}})
rd()})}rd()}).catch(function(){tx.innerHTML='网络错误';sc()})}
function cc(){document.getElementById('chb').innerHTML='<div class="chp">对话已清除</div>'}
function copyMsg(b){
    var tx=b.parentElement.querySelector('.tx');
    var plain=tx.innerText||tx.textContent;
    var rich='<html><body style="font-family:-apple-system,sans-serif;font-size:14px;line-height:1.6">'+tx.innerHTML+'</body></html>';
    var pb=new Blob([rich],{type:'text/html'});
    var tb=new Blob([plain],{type:'text/plain'});
    try{
        navigator.clipboard.write([new ClipboardItem({'text/html':pb,'text/plain':tb})]).then(function(){
            b.textContent='✅';setTimeout(function(){b.textContent='📋'},1500)
        }).catch(function(){
            navigator.clipboard.writeText(plain).then(function(){
                b.textContent='✅';setTimeout(function(){b.textContent='📋'},1500)
            }).catch(function(){prompt('复制失败:',plain)})
        })
    }catch(e){
        navigator.clipboard.writeText(plain).then(function(){
            b.textContent='✅';setTimeout(function(){b.textContent='📋'},1500)
        }).catch(function(){prompt('复制失败:',plain)})
    }
}
function dbConnect(){
    var url=document.getElementById('dbu').value.trim();
    var user=document.getElementById('dbn').value.trim();
    var pass=document.getElementById('dbp').value;
    if(!url){document.getElementById('dbr').innerHTML='<span style="color:#ef4444">请输入连接 URL</span>';return}
    document.getElementById('dbb').disabled=true;
    document.getElementById('dbr').innerHTML='&#x23F3; 连接中...';
    document.getElementById('dbt').style.display='none';
    fetch('/dbconnect',{method:'POST',body:JSON.stringify({url:url,user:user,password:pass}),headers:{'Content-Type':'application/json'}})
    .then(function(r){return r.json()})
    .then(function(d){
        document.getElementById('dbb').disabled=false;
        if(d.error){
            document.getElementById('dbr').innerHTML='<span style="color:#ef4444">&#x274C; '+d.error+'</span>';
            return;
        }
